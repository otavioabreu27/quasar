apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  labels:
    app.kubernetes.io/name: report-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: report-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: report-service
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: report-service
      containers:
        - name: report-service
          image: ghcr.io/otavioabreu27/report_service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: report-service
                  key: DATABASE_URL
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8080"
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DB_POOL_SIZE
              value: "3"
            - name: DB_WORKER_POOL_SIZE
              value: "4"
            - name: DB_CONTROL_POOL_SIZE
              value: "1"
            - name: REAPER_INTERVAL_MS
              value: "1000"
            - name: COMPLETION_MODE
              value: transactional
            - name: WORKER_CONCURRENCY
              value: "8"
            - name: WORKER_PREFETCH
              value: "1"
            - name: QUEUE_POLL_INTERVAL_MS
              value: "5000"
            - name: HTTP_POOL_WORKERS
              value: "32"
            - name: HTTP_POOL_PREFETCH
              value: "2"
            - name: HTTP_BUFFER_CAPACITY
              value: "256"
            - name: SIMULATED_WORK_MS
              value: "0"
            - name: RETENTION_COMPLETED_DAYS
              value: "7"
            - name: RETENTION_CANCELLED_DAYS
              value: "30"
            - name: RETENTION_DISCARDED_DAYS
              value: "30"
            - name: RETENTION_BATCH_SIZE
              value: "1000"
            - name: RETENTION_PAUSE_MS
              value: "100"
            - name: RETENTION_INTERVAL_MS
              value: "60000"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
