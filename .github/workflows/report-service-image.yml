name: report-service image

on:
  push:
    branches: [main]
    paths:
      - "examples/report_service/**"
      - ".github/workflows/report-service-image.yml"
  pull_request:
    paths:
      - "examples/report_service/**"
      - ".github/workflows/report-service-image.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: report_service

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/report_service
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2"
          gleam-version: "1.18.1"
          rebar3-version: "3"
          hexpm-mirrors: https://builds.hex.pm
      - run: gleam deps download
      - run: gleam format --check
      - run: gleam test

  image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=report_service
            org.opencontainers.image.description=Quasar report service example
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: examples/report_service
          file: examples/report_service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
